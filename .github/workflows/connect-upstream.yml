name: Connect upstream history

on:
  push:
    branches:
      - cursor/crates-nightcore-folia-af64
    paths:
      - '.github/workflows/connect-upstream.yml'

permissions:
  contents: write

jobs:
  connect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch and merge upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ssquadteam"
          git config user.email "58975768+ssquadteam@users.noreply.github.com"

          curl -fsSL -o /tmp/upstream-nightcore.patch \
            "https://raw.githubusercontent.com/ssquadteam/Better-NightCore/cursor/crates-patch-staging-af64/.staging/excellentcrates/upstream-nightcore.patch"
          git apply --index /tmp/upstream-nightcore.patch
          git rm -f --ignore-unmatch libs/nightcore-3.0.3.jar
          git add -A
          git commit -m "Apply upstream v6.6.1 merge and Better-NightCore 3.1.0/Lettuce."

          git remote add upstream https://github.com/nulli0n/ExcellentCrates-spigot.git
          git fetch upstream master
          git merge -X ours --no-ff --no-edit upstream/master

          git rm -f .github/workflows/connect-upstream.yml
          git commit -m "Remove temporary upstream-connect workflow."

          git push origin HEAD:cursor/crates-nightcore-folia-af64
